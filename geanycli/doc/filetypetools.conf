# filetypetools.conf
#
# Run code with the correct tools
#
# %p filepath -  absolute path
# %d dir - realative dir (to project's root)
# %f filename - name of the file
# %e extention - file extention.
# %l line - current line number in editor. 
#


# Java Tools #

[pom.xml]
tool_0=Mvn install
tool_0=cd %d; mvn install

[dir:pom.xml]
name_0=Mvn install
tool_0=cd %d; mvn install
name_1=Mvn test.skip
tool_1=cd %d; mvn install -Dmaven.test.skip=true

[.java]
tool_0=Mvn install
tool_0=bash -c 'd=$(dirname %p); while [ "$d" != "/" ] && [ ! -f "$d/pom.xml" ]; do d=$(dirname "$d"); done; [ -f "$d/pom.xml" ] && cd %d && mvn install || echo "No pom.xml found"'

# C Tools #

[dir:Makefile]
name_0=Make
tool_0=cd %d; make

[.c]
name_0=cppcheck
tool_0=cppcheck %p

[.h]
name_0=cppcheck
tool_0=cppcheck %p

[.md]
name_0=Lint
tool_0=markdownlint %p

[.c.snip]
name_0=Snip run
tool_0=sniprun %p

# Bash tools #

[.sh]
name_2=Lint
tool_2=bash -n %p
name_0=Run ./...
tool_0=./%d/%f
name_1=Run /...
tool_1=bash %p
name_2=Debug /...
tool_2=bash -x %p
name_3=Shellcheck /
tool_3=shellcheck %p

# Linter #

[.xml]
name_0=Lint
tool_0=xmllint %p

[.py]
name_0=Py compile
tool_0=python3 -m py_compile %p
name_1=Flake8
tool_1=python3 -m flake8 %p
name_2=Py lint
tool_2=python3 -m pylint %p
name_3=Mypy
tool_3=python3 -m mypy %p

[.js]
name_0=Node run
tool_0=node %p
name_1=Jshint
tool_1=jshint %p
name_2=Eslint
tool_2=eslint %p

[.ts]
name_0=Lint
tool_0=tsc --noEmit %p
name_1=Eslint
tool_1=eslint %p

[.json]
name_0=Lint
tool_0=python3 -m json.tool %p

[.yaml]
name_0=Lint
tool_0=yamllint %p

[.yml]
name_0=Lint
tool_0=yamllint %p

[.go]
name_0=Lint
tool_0=go vet %p
name_1=Build
tool_1=go build %p

[.rs]
name_0=Lint
tool_0=rustfmt --check %p
name_1=Clippy
tool_1=cargo clippy

[.html]
name_0=Lint
tool_0=tidy -errors -quiet %p

[.css]
name_0=Lint
tool_0=stylelint %p

[.*]
name_0=File type
tool_0=file %p


