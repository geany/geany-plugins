# servertools.conf — example configuration for the Geany Servers plugin
#
# Place this file at:
#   ~/.config/geany/servertools.conf          (user defaults)
#   <project>/config/geany/servertools.conf   (project-level overrides)
#   <project>/config/geany/servertools_extra.conf  (additive; indices offset by 100)
#
# Project config keys overlay the user config (same index wins).
# Extra config keys are appended and never overwrite user or project keys.

[servers]

# --- nginx (systemd-managed) -------------------------------------------
server_0=🕋 nginx
name_0=nginx
type_0=systemd
# Reload nginx when web assets or CGI scripts change
changes_0=reload src/www;src/cgi
# ping_0 checks whether nginx is actually serving (not just running)
ping_0=curl -sf http://localhost/ > /dev/null
log_0=/var/log/nginx/error.log

# --- mock API server (local process) ------------------------------------
server_1=🤖 mock API
type_1=local
start_1=npm --prefix mock/ run start
stop_1=pkill -f "node.*mock"
ping_1=curl -sf http://localhost:3001/health > /dev/null
log_1=mock/mock.log
# Restart the mock when its source changes
changes_1=reload mock/src

# --- firewall (systemd, no ping needed) --------------------------------
server_2=🧱 firewall
name_2=ufw
type_2=systemd


# -----------------------------------------------------------------------
# [arse] — Automatic Recovery of Server Execution
#
# ARSE entries appear below the server list and represent orphaned or
# stale processes that should not be running.  The check command is run
# when the Servers tab is focused; if it exits 0 (process found) the row
# turns yellow as a warning.  Pressing the "🧻 Kill" button runs the
# kill command to clean up the stale processes.
#
# Keys per ARSE entry (N = index):
#   arse_N        — display label shown in the list
#   arse_check_N  — command that exits 0 if stale processes exist
#   arse_kill_N   — command to kill those processes
# -----------------------------------------------------------------------

[arse]

# Detect and kill stale nginx worker processes left after a failed stop
arse_0=🧻 stale nginx
arse_check_0=pgrep -x nginx
arse_kill_0=pkill -x nginx

# Detect and kill stale node mock server processes
arse_1=🧻 stale mock
arse_check_1=pgrep -f "node.*mock"
arse_kill_1=pkill -f "node.*mock"
